# Deploy both services from GitHub: https://dashboard.render.com/select-repo?type=blueprint
services:
  - type: web
    name: gwf-api
    runtime: docker
    plan: free
    rootDir: backend/Gwf.Api
    healthCheckPath: /api/products
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: AllowedOrigins
        fromService:
          type: web
          name: gwf-web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: gwf-web
    runtime: static
    rootDir: frontend/gwf-web
    buildCommand: npm install && npm run build:render
    staticPublishPath: dist/gwf-web/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_HOST
        fromService:
          type: web
          name: gwf-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME
